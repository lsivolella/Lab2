spring.application.name=rentacar

# ==========================================================================
# SERVER
# The front-end (React + Vite) calls this port: http://localhost:8080
# ==========================================================================
server.port=8080

# ==========================================================================
# SUPABASE POSTGRESQL
#
# Set SUPABASE_DB_URL with the JDBC connection string copied from
# Supabase Dashboard > Connect > Session pooler > JDBC. Do not commit it:
# it contains the database password.
# ==========================================================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
# The Session pooler (free plan) accepts at most 15 clients in total. Keep each
# process small so the running app and the test contexts fit together.
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.open-in-view=false
spring.config.import=optional:file:./.env[.properties]

# ==========================================================================
# SUPABASE STORAGE (car images)
# Read by the config/StorageProperties.java class (prefix "app.storage")
#
# Uploads go from the backend to the "car-images" bucket (public read).
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY come from backend/.env; the key
# (secret or legacy service_role) must never reach the frontend. Without them
# the app still starts, and image uploads answer 503.
# ==========================================================================
app.storage.url=${SUPABASE_URL:}
app.storage.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.bucket=car-images
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ==========================================================================
# SEED AGENTS
# Read by the config/AgentSeeder.java class
# Agents (companies and banks) cannot self-register: these accounts are
# created on startup if no user with the same email or CNPJ exists.
# Passwords come from backend/.env; an agent without password is skipped.
# ==========================================================================
app.seed.agents[0].name=Rentacar Locadora Ltda
app.seed.agents[0].cnpj=11222333000181
app.seed.agents[0].type=COMPANY
app.seed.agents[0].email=${SEED_COMPANY_EMAIL:empresa@rentacar.com}
app.seed.agents[0].password=${SEED_COMPANY_PASSWORD:}

app.seed.agents[1].name=Banco Rentacar S.A.
app.seed.agents[1].cnpj=12345678000195
app.seed.agents[1].type=BANK
app.seed.agents[1].email=${SEED_BANK_EMAIL:banco@rentacar.com}
app.seed.agents[1].password=${SEED_BANK_PASSWORD:}

# ==========================================================================
# DEMO DATA
# Read by the config/DemoDataSeeder.java class
# On every startup: creates (or restores) the demo customers
# cliente@rentacar.com and cliente2@rentacar.com and recreates their orders
# with dates relative to today, one per situation. Other customers' orders
# are never touched. Set to false to keep the database as it is.
# ==========================================================================
app.seed.demo-data.enabled=true
app.seed.demo-data.password=${SEED_CUSTOMER_PASSWORD:senha1234}

# ==========================================================================
# SPRING DOC
# ==========================================================================
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
# Swagger UI copies the XSRF-TOKEN cookie into the X-XSRF-TOKEN header
springdoc.swagger-ui.csrf.enabled=true
