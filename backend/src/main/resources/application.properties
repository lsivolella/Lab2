spring.application.name=rentacar

# ==========================================================================
# SERVER
# The front-end (React + Vite) calls this port: http://localhost:8080
# ==========================================================================
server.port=8080

# ==========================================================================
# SUPABASE POSTGRESQL
#
# Set SUPABASE_DB_URL with the JDBC connection string copied from
# Supabase Dashboard > Connect > Session pooler > JDBC. Do not commit it:
# it contains the database password.
# ==========================================================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.open-in-view=false
spring.config.import=optional:file:./.env[.properties]

# ==========================================================================
# CORS (who can call this API via browser)
# Read by the config/CorsProperties.java class (prefix "app.cors")
#
# - http://localhost:5173 -> front-end running on your computer (npm run dev)
# - https://...vercel.app -> front-end published on Vercel (replace with your URL)
# Separate with commas and DO NOT put a trailing slash (/).
# ==========================================================================
# app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://rentacar.vercel.app}

# ==========================================================================
# INITIAL MENU
# Read by the config/InitialFleet.java class
# true -> if the "vehicles" collection is empty, it saves some example items
# ==========================================================================
# app.initial-fleet.populate-on-startup=true

# ==========================================================================
# SPRING DOC
# ==========================================================================
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
